name: astrbot_plugin_relation
display_name: 关系识别插件
short_desc: 用户自定义关系，自动注入到 LLM 上下文
desc: |
  用户可通过指令设置自己的关系（如恋人），
  每次 LLM 请求时，将关系提示注入到上下文中。
  支持管理员查看所有关系。
